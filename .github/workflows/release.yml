# A version tag builds the Windows player and publishes its installer, its portable zip and the
# libraries' source with a checksum list. Run by hand (Actions, release, Run workflow), it builds
# and checks the same files and keeps them as the run's artifact, publishing nothing, even on a tag.
# The player isn't installed through a server, so it holds no module key. Signing the program
# itself is a step for when there is a code-signing certificate: docs in its README.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  # The tag of WittyVisualizer the player is built with.
  VISUALIZER_TAG: v0.2.1

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: WittyMediaPlayer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: WittyMediaPlayer
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyVisualizer
          ref: ${{ env.VISUALIZER_TAG }}
          path: WittyVisualizer
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: The version, which a tag must match
        run: |
          want="$(sed -n 's/^project(WittyMediaPlayer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ -n "$want" ] || { echo "CMakeLists.txt has no version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "CMakeLists.txt says $want, and the tag is $GITHUB_REF_NAME"; exit 1; }
          fi
          echo "VERSION=$want" >> "$GITHUB_ENV"
      - name: Build
        run: |
          bash scripts/setup-toolchain.sh
          bash scripts/build-windows.sh
      - name: Get the WiX Toolset
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/wix" wix --version 6.0.2
          "$RUNNER_TEMP/wix/wix" extension add -g WixToolset.UI.wixext/6.0.2 WixToolset.Util.wixext/6.0.2
      - name: Build the installer
        run: |
          WIX_EXE="$RUNNER_TEMP/wix/wix.exe" powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build-msi.ps1 \
            -Version "$VERSION" -PackageDir ".build/WittyMediaPlayer-$VERSION-windows-amd64" -OutDir .build
      - name: Check the installer, without installing it
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test/check-msi.ps1 \
            -Msi ".build/WittyMediaPlayer-$VERSION-windows-amd64.msi" -Version "$VERSION" \
            -Scratch "$RUNNER_TEMP/msi-check" -PackageDir ".build/WittyMediaPlayer-$VERSION-windows-amd64"
      - name: Write the checksum list
        run: |
          cd .build
          # What the licences of FFmpeg and LAME ask to go with the program (see licenses/THIRD-PARTY.txt).
          powershell.exe -NoProfile -Command "Compress-Archive -Path source -DestinationPath WittyMediaPlayer-$VERSION-third-party-source.zip"
          sha256sum WittyMediaPlayer-*.zip WittyMediaPlayer-*.msi > "WittyMediaPlayer-$VERSION-SHA256SUMS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: |
            WittyMediaPlayer/.build/WittyMediaPlayer-*.msi
            WittyMediaPlayer/.build/WittyMediaPlayer-*.zip
            WittyMediaPlayer/.build/*-SHA256SUMS.txt
          if-no-files-found: error
          # .build starts with a dot, which the action leaves out unless told.
          include-hidden-files: true

  # Publishing runs no project code at all.
  publish:
    needs: build
    # Only a pushed tag publishes; a run by hand never does.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
