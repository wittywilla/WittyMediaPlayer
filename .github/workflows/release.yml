# A version tag builds the Windows player and publishes it with a checksum list. The player
# isn't installed through a server, so it holds no module key. Signing the program itself is
# a step for when there is a code-signing certificate: docs in its README.
name: release
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  # The tag of WittyVisualizer the player is built with.
  VISUALIZER_TAG: v0.1.0

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: WittyMediaPlayer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: WittyMediaPlayer
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyVisualizer
          ref: ${{ env.VISUALIZER_TAG }}
          path: WittyVisualizer
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: The tag must match the version
        run: |
          want="$(sed -n 's/^project(WittyMediaPlayer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "CMakeLists.txt says $want, and the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Build
        run: |
          bash scripts/setup-toolchain.sh
          bash scripts/build-windows.sh
      - name: Write the checksum list
        run: |
          cd .build
          sha256sum WittyMediaPlayer-*.zip > "WittyMediaPlayer-${GITHUB_REF_NAME#v}-SHA256SUMS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: |
            WittyMediaPlayer/.build/WittyMediaPlayer-*.zip
            WittyMediaPlayer/.build/*-SHA256SUMS.txt
          if-no-files-found: error

  # Publishing runs no project code at all.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
